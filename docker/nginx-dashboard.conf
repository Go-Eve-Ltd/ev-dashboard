
server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;

  port_in_redirect off;

  # Do not advertise the nginx version in the Server header or error pages
  server_tokens off;

  # Security headers (applied to every response, including errors).
  # Kept at server level with no add_header in the location block, so they are inherited.
  # TLS is terminated at the Google Cloud load balancer; browsers only act on HSTS over HTTPS.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  #access_log /var/log/nginx/access.log main;

  # Static single-page application. The wildcard CORS headers previously set here
  # (Access-Control-Allow-Origin: *) have been removed: the dashboard is loaded
  # same-origin and does not need to be readable by other sites.
  location / {
    root  /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
    error_page 404 /index.html;
  }
}
